<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Link</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --danger: #f87171;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .icon-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .lock-icon {
            width: 48px;
            height: 48px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
        }

        input[type="password"] {
            background-color: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.75rem 1rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            text-align: center;
            margin-top: 0.5rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="icon-container">
            <!-- Simple SVG Lock Icon -->
            <svg class="lock-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <h1>Protected Link</h1>
        <p>This destination is password-protected. Enter the password below to continue.</p>

        <form id="password-form">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter link password..." required
                autofocus />
            <button type="submit" id="submit-btn">Unlock & Continue</button>
            <div id="error-message" class="error-message"></div>
        </form>
    </div>

    <script>
        document.getElementById('password-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const passwordInput = document.getElementById('password');
            const submitBtn = document.getElementById('submit-btn');
            const errorMessage = document.getElementById('error-message');

            // Reset error display
            errorMessage.style.display = 'none';
            errorMessage.textContent = '';
            submitBtn.disabled = true;

            // Extract the slug from current path (e.g., "/my-slug" -> "my-slug")
            const pathSegments = window.location.pathname.split('/').filter(Boolean);
            const slug = pathSegments[pathSegments.length - 1];

            if (!slug) {
                errorMessage.textContent = 'Invalid request path.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                return;
            }

            try {
                // Send request to server verify endpoint
                const response = await fetch(`/${slug}/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password: passwordInput.value
                    })
                });

                if (response.ok || response.redirected) {
                    // If Axum responds with 303/302 or successful verification, 
                    // reload/navigate back to the slug to trigger the authenticated GET redirect
                    window.location.href = `/${slug}`;
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorMessage.textContent = data.error || 'Invalid password. Please try again.';
                    errorMessage.style.display = 'block';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorMessage.textContent = 'Network error. Please try again.';
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
