<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axum URL Shortener</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: grid;
            place-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.15s ease;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.25rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }

        #result.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        #result.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        #result a {
            color: var(--text);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Shorten URL</h1>
        <p class="subtitle">High-concurrency Rust link shortener</p>

        <form id="shorten-form">
            <div class="form-group">
                <label for="url">Destination URL *</label>
                <input type="url" id="url" placeholder="https://github.com/rust-lang/rust" required>
            </div>

            <button type="submit" id="submit-btn">Create Short Link</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const submitBtn = document.getElementById('submit-btn');
        const resultDiv = document.getElementById('result');
        const urlInput = document.getElementById('url');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            resultDiv.className = '';
            resultDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Shortening...';

            const payload = {
                long_url: urlInput.value.trim(),
            };

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    const key = data.slug;
                    const fullShortUrl = `${window.location.origin}/${key}`;

                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `Short link created: <a href="${fullShortUrl}" target="_blank" rel="noopener">${fullShortUrl}</a>`;
                    
                    urlInput.value = '';
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = data.error || `Failed with status code ${response.status}.`;
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Network error. Could not connect to the Axum server.';
            } finally {
                // 5. Re-enable form controls
                resultDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Short Link';
            }
        });
    </script>
</body>
</html>
