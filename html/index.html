<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axum URL Shortener</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: grid;
            place-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.375rem;
            color: var(--muted);
        }

        .optional {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--primary);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 0.1rem 0.5rem;
        }

        input {
            width: 100%;
            padding: 0.625rem 0.75rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        input.invalid {
            border-color: var(--error);
        }

        input.invalid:focus {
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        .hint {
            margin: 0.375rem 0 0;
            font-size: 0.75rem;
            color: var(--muted);
        }

        .error-text {
            display: none;
            margin: 0.375rem 0 0;
            font-size: 0.75rem;
            color: var(--error);
        }

        .error-text.visible {
            display: block;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.5rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        button:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #result {
            margin-top: 1.25rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.875rem;
            display: none;
            word-break: break-all;
        }

        #result.success {
            display: block;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
        }

        #result.error {
            display: block;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: var(--error);
        }

        #result a {
            color: var(--text);
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Shorten URL</h1>
        <p class="subtitle">High-concurrency Rust link shortener</p>

        <form id="shorten-form" novalidate>
            <div class="form-group">
                <label for="url">Destination URL *</label>
                <input type="url" id="url" placeholder="https://github.com/rust-lang/rust" autocomplete="off" spellcheck="false">
                <p class="error-text" id="url-error"></p>
            </div>

            <div class="form-group">
                <label for="slug">Custom slug <span class="optional">optional</span></label>
                <input type="text" id="slug" placeholder="e.g. my-cool-link" maxlength="20" autocomplete="off" spellcheck="false">
                <p class="hint">7–20 characters. Letters, numbers and dashes only.</p>
                <p class="error-text" id="slug-error"></p>
            </div>

            <div class="form-group">
                <label for="password">Password <span class="optional">optional</span></label>
                <input type="password" id="password" placeholder="Lock link behind a password" autocomplete="new-password">
                <p class="hint">Leave empty to allow direct access.</p>
                <p class="error-text" id="password-error"></p>
            </div>

            <button type="submit" id="submit-btn" disabled>Create Short Link</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const form = document.getElementById('shorten-form');
        const submitBtn = document.getElementById('submit-btn');
        const resultDiv = document.getElementById('result');

        const urlInput = document.getElementById('url');
        const slugInput = document.getElementById('slug');
        const passwordInput = document.getElementById('password');

        const urlError = document.getElementById('url-error');
        const slugError = document.getElementById('slug-error');
        const passwordError = document.getElementById('password-error');

        const SLUG_MAX = 20;

        function setError(el, message) {
            el.textContent = message;
            el.classList.toggle('visible', !!message);
        }

        function setInvalid(input, invalid) {
            input.classList.toggle('invalid', invalid);
        }

        function isValidUrl(value) {
            try {
                const u = new URL(value);
                return (u.protocol === 'http:' || u.protocol === 'https:') && !!u.hostname;
            } catch {
                return false;
            }
        }

        function validateUrl() {
            const value = urlInput.value.trim();
            if (!value) {
                setError(urlError, 'A destination URL is required.');
                setInvalid(urlInput, true);
                return false;
            }
            if (!isValidUrl(value)) {
                setError(urlError, 'Enter a valid http(s) URL.');
                setInvalid(urlInput, true);
                return false;
            }
            setError(urlError, '');
            setInvalid(urlInput, false);
            return true;
        }

        function validateSlug() {
            const value = slugInput.value.trim();
            if (!value) {
                setError(slugError, '');
                setInvalid(slugInput, false);
                return true;
            }
            if (!/^[\p{L}\p{N}-]+$/u.test(value)) {
                setError(slugError, 'Only letters, numbers and dashes are allowed.');
                setInvalid(slugInput, true);
                return false;
            }
            if (value.length < 7) {
                setError(slugError, `Must be at least 7 characters (currently ${value.length}).`);
                setInvalid(slugInput, true);
                return false;
            }
            if (value.length > SLUG_MAX) {
                setError(slugError, `Must be at most ${SLUG_MAX} characters.`);
                setInvalid(slugInput, true);
                return false;
            }
            setError(slugError, '');
            setInvalid(slugInput, false);
            return true;
        }

        function validatePassword() {
            const value = passwordInput.value;
            if (value && value.trim().length === 0) {
                setError(passwordError, 'Password cannot be only spaces.');
                setInvalid(passwordInput, true);
                return false;
            }
            setError(passwordError, '');
            setInvalid(passwordInput, false);
            return true;
        }

        function validate() {
            const urlOk = validateUrl();
            const slugOk = validateSlug();
            const passwordOk = validatePassword();
            submitBtn.disabled = !(urlOk && slugOk && passwordOk);
        }

        urlInput.addEventListener('input', validate);
        slugInput.addEventListener('input', validate);
        passwordInput.addEventListener('input', validate);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            validate();
            if (submitBtn.disabled) return;

            resultDiv.className = '';
            resultDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Shortening...';

            const payload = {
                long_url: urlInput.value.trim(),
                slug: slugInput.value.trim() || null,
                password: passwordInput.value.trim() || null
            };

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    const key = data.slug;
                    const fullShortUrl = `${window.location.origin}/${key}`;

                    resultDiv.className = 'success';
                    resultDiv.innerHTML = `Short link created: <a href="${fullShortUrl}" target="_blank" rel="noopener">${fullShortUrl}</a>`;

                    urlInput.value = '';
                    slugInput.value = '';
                    passwordInput.value = '';
                    validate();
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = data.error || `Failed with status code ${response.status}.`;
                }
            } catch (err) {
                resultDiv.className = 'error';
                resultDiv.textContent = 'Network error. Could not connect to the Axum server.';
            } finally {
                resultDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Short Link';
            }
        });

        validate();
    </script>
</body>

</html>
