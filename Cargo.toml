[package]
name = "axum-url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.5", features = ["cookie"] }
tokio = { version = "*", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio","sqlite"] }
dotenvy = "0.15"
sqids = "0.4.2"
serde = "1.0.229"
serde_json = "1.0.151"
chrono = "0.4.45"
url = "2.5.8"
