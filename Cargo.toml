[package]
name = "axum-url-shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
axum-extra = { version = "0.12.5", features = ["cookie","cookie-private"] }
tokio = { version = "*", features = ["full"] }
sqlx = { version = "0.9", features = [ "runtime-tokio","sqlite", "chrono"] }
dotenvy = "0.15"
sqids = "0.4.2"
serde = "1.0.229"
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"]}
url = "2.5.8"
argon2 = {version = "0.5.3", features = ["std"]}
base64 = "0.23.1"
constant_time_eq = "0.5.0"
